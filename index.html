function update(){let terms=q.value.trim().toLowerCase().split(/\s+/).filter(Boolean);let rows=data.filter(r=>{if(type.value&&r.type!==type.value)return false;if(kind.value&&r.kind!==kind.value)return false;if(!terms.length)return true;let text=flatten(r).join(' ').toLowerCase();return terms.every(term=>text.includes(term))});count.textContent=`${rows.length} / ${data.length} records`;list.innerHTML=rows.length?rows.map(render).join(''):'<div class="empty">No matching records.</div>';let x=new URLSearchParams();if(q.value)x.set('q',q.value);if(type.value)x.set('type',type.value);x.set('kind',kind.value);if(lang.value!=='both')x.set('lang',lang.value);try{history.replaceState(null,'',location.pathname+(x.toString()?'?'+x:''))}catch(e){}}
[q,type,kind,lang].forEach(e=>e.addEventListener(e===q?'input':'change',update));update();
